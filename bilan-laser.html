<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilan Laser – Le Spa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>
:root{--bx:#642B3B;--br:#654536;--be:#E9DCCD;--cr:#F8F3EC;--tx:#654536;--ln:#D3C2AE}
*{box-sizing:border-box}
body{margin:0;background:var(--cr);color:var(--tx);font:15px/1.5 system-ui,Helvetica,Arial,sans-serif}
header{background:var(--bx);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:5;height:54px}
.brand{font:500 26px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.04em}
.brand small{text-transform:uppercase;display:block;font-size:11px;letter-spacing:.14em;opacity:.8;margin-top:3px}
#bg{display:none;background:none;border:0;color:#fff;font-size:24px;padding:0}
#st{margin-left:auto;font-size:13px;opacity:.9}
.lay{display:flex;min-height:calc(100vh - 54px)}
aside{width:270px;background:var(--be);padding:12px;flex:none;display:flex;flex-direction:column;gap:8px;position:sticky;top:54px;align-self:flex-start;height:calc(100vh - 54px);overflow:auto}.col{flex:1;min-width:0}
#list{display:flex;flex-direction:column;gap:4px;overflow:auto}
.ci{text-align:left;background:#fff8;border:1px solid transparent;border-radius:8px;padding:8px 10px;font:inherit;color:inherit;cursor:pointer}
.ci small{display:block;color:var(--br)}.ci.on{background:#fff;border-color:var(--br)}
main{flex:1;min-width:0;padding:20px 28px 60px;border-left:6px solid var(--br);margin:16px 0 16px 0}
h1{font-size:28px;color:var(--bx);margin:0}h2{color:var(--bx);font-size:24px;margin:8px 0 2px}
h3{background:var(--be);color:var(--bx);border-radius:10px;padding:8px 14px;font-size:16px;margin:26px 0 14px}
h4{color:var(--br);margin:20px 0 8px;font-size:15px}
.mu{color:var(--br);margin:2px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;position:sticky;top:54px;z-index:5;background:var(--cr);border-bottom:2px solid var(--ln);overflow-x:auto;padding:0 8px}
.tabs button{background:none;border:0;padding:9px 14px;font:inherit;color:var(--br);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--bx);font-weight:700;border-color:var(--bx)}
.p{display:none}.p.on{display:block}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--br);margin-bottom:10px}
input[type=password],input[type=text],input[type=tel],input[type=email],input[type=date],textarea,.sig{font:15px system-ui,sans-serif;color:var(--tx);border:1px solid var(--ln);background:#fff;border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--bx);outline-offset:1px}
.ck{display:grid;grid-template-columns:1fr;gap:0;margin-bottom:10px}
.c{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.c input{width:20px;height:20px;accent-color:var(--bx);flex:none}
button{font:inherit;border:1px solid var(--br);background:#fff;color:var(--br);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p2,#nw{background:var(--bx);color:#fff;border-color:var(--bx)}
button.d{color:#a3202f;border-color:#d9a3a9}
.al{background:#f8e3dc;border-left:4px solid var(--bx);padding:8px 12px;border-radius:6px;margin:10px 0}.al:empty{display:none}
.sig{height:90px;display:flex;align-items:center;justify-content:center;color:var(--ln);cursor:pointer;padding:4px}.sig img{max-height:80px;max-width:100%}
details.se{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:0 16px;margin:10px 0}
details.se[open]{padding-bottom:16px}
summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--bx);display:flex;gap:12px;align-items:center}
summary span{font-weight:400;color:var(--br)}summary em{background:var(--be);border-radius:20px;padding:1px 10px;font-size:12px;font-style:normal}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th{background:var(--bx);color:#fff;text-align:left;padding:8px}td{padding:9px 8px;border-bottom:1px solid var(--ln)}tr[data-go]{cursor:pointer}tr[data-go]:hover{background:var(--be)}
.info p{max-width:none}.empty{padding:50px 10px;color:var(--br)}
dialog{border:0;border-radius:12px;padding:16px;width:min(680px,94vw)}dialog::backdrop{background:#0006}
canvas{width:100%;border:1px dashed var(--br);border-radius:8px;touch-action:none;background:#fff}
.r{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bx);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}#toast.show{display:block}
.ck.s{grid-template-columns:1fr}.tabs button{flex:1 0 auto;white-space:nowrap;margin-bottom:0}.tabs:empty{display:none}main p,main li{text-align:justify;hyphens:auto}.mu{opacity:.85}
.sb{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.sb button.on{background:var(--bx);color:#fff;border-color:var(--bx)}
.f b{color:var(--tx);font-size:15px;font-weight:600}.vb{background:var(--be);border-radius:10px;padding:12px 16px;margin:10px 0}
td input{min-width:100px;padding:6px}td input[type=date]{min-width:140px}
#out{background:none;color:#fff;border-color:#fff9;padding:5px 10px;font-size:13px}
#lg{position:fixed;inset:0;background:var(--cr);z-index:20;display:none;align-items:center;justify-content:center}
#lg>div{background:#fff;border-radius:14px;padding:28px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px;border:1px solid var(--ln)}
#lerr{color:#a3202f;min-height:1.3em;font-size:14px}
@media(max-width:800px){#bg{display:block}aside{position:fixed;left:-290px;top:54px;bottom:0;height:auto;z-index:6;transition:left .2s}aside.open{left:0}main{padding:16px 14px 60px;border-left-width:4px}}
@media print{header,aside,.no{display:none!important}.p{display:block!important}.lay{display:block}main{border:0;max-width:none}details.se{break-inside:avoid}}
@page{size:A4;margin:12mm 12mm 16mm;@bottom-left{content:"LE SPA • Dossier client épilation laser";font-size:8pt;color:#654536}@bottom-right{content:counter(page);font-size:8pt;color:#654536}}
.ph{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff;font-size:10pt}#lg,#tb,.sb,.top{display:none!important}main{padding:0}
.ph{display:block;margin-bottom:8mm}.ph .bd{background:var(--bx);color:#fff;border-radius:10px;padding:5mm;display:flex;justify-content:center}
.ph img{height:24mm;border-radius:8px;display:block;background:var(--cr);padding:2.5mm 6mm;box-sizing:content-box}.ph h1{text-align:center;margin:8mm 0 1mm;font-size:22pt}
.ph .sub{text-align:center;color:var(--br);letter-spacing:.25em;font-size:10pt;margin-bottom:6mm}
.ph .id{background:var(--be);border-radius:10px;padding:5mm 6mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm}
.ph .id span{display:flex;flex-direction:column;font-size:8pt}.ph .id b{font-size:11pt;color:var(--tx);font-weight:600}
.p+.p{margin-top:10mm}.p h2{font-size:16pt;border-bottom:2px solid var(--br);padding-bottom:2mm;margin-bottom:3mm;break-after:avoid}
h3{break-after:avoid;margin:6mm 0 3mm;padding:5px 10px;font-size:11pt}h3.sn{background:var(--br);color:#fff}h4{break-after:avoid;margin:3mm 0 1mm}
.ck{margin-bottom:2mm}.c{padding:2px 0}.ck,.vb,.sig,.f,.g,.info p,tr{break-inside:avoid}.g{gap:2mm 8mm}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea{border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;padding:2px 0}
textarea{resize:none;overflow:visible;min-height:12mm}.sig{border:1px solid var(--ln);height:24mm;color:transparent}
table{min-width:0;font-size:9pt}td input{min-width:0;padding:2px}.tw{overflow:visible}}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--be);border-radius:16px;padding:24px 28px;margin-bottom:18px}
.hero .hl{background:var(--cr);border-radius:12px;padding:16px 26px;flex:none}.hero img{display:block;width:min(300px,70vw);border-radius:8px}
.hero h1{font-size:34px;margin:0 0 6px}main .lead{text-align:left;max-width:46ch;margin:0 0 8px}.r2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.bt{display:inline-block;border:1px solid var(--br);border-radius:8px;padding:8px 14px;color:var(--br);text-decoration:none;background:#fff}.bt:hover,.ic:hover{border-color:var(--bx)}
.info4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}@media(max-width:1100px){.info4{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.info4{grid-template-columns:1fr}}
.ic{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px 16px;color:var(--br);text-decoration:none;font-size:13px}.ic b{color:var(--tx);font-size:15px;font-weight:600}
@media(prefers-reduced-motion:reduce){aside{transition:none}}

async function q(p){const r=await p;if(r.error){toast('Erreur : '+r.error.message);throw r.error}return r.data}
async function loadList(){list=await q(db.from('laser_clients').select('id,nom,prenom,telephone').order('nom'));drawList()}

async function openC(id){await flush();C=await q(db.from('laser_clients').select('*').eq('id',id).single());C.dossier=C.dossier||{};S=await q(db.from('laser_seances').select('*').eq('client_id',id).order('numero'));S.forEach(s=>s.donnees=s.donnees||{});tab='bilan';drawList();render();$('#side').classList.remove('open')}
async function flush(){clearTimeout(timer);if(dirty.size)await save()}
function mark(sid){dirty.add(sid?String(sid):'c');setSt('Modifié…');clearTimeout(timer);timer=setTimeout(save,1200)}
async function save(){if(!C)return;const ids=[...dirty];dirty.clear();setSt('Enregistrement…');try{const d=C.dossier;
if(ids.includes('c')){await q(db.from('laser_clients').update({nom:d.nom||'',prenom:d.prenom||'',telephone:d.telephone||'',email:d.email||'',dossier:d}).eq('id',C.id));const l=list.find(x=>x.id==C.id);if(l){l.nom=d.nom;l.prenom=d.prenom;l.telephone=d.telephone;drawList()}}
for(const s of S)if(ids.includes(String(s.id)))await q(db.from('laser_seances').update({donnees:s.donnees,date_seance:s.donnees.date||null}).eq('id',s.id));
setSt('Enregistré')}catch(e){ids.forEach(i=>dirty.add(i));setSt('Non enregistré')}}

const pConsent=d=>`<h2>Consentement Éclairé</h2><p class="mu">Épilation laser — lecture et validation avant traitement</p><h3>Information</h3><div class="info">
<p>Le laser vise une réduction durable et progressive de la pilosité. Le nombre de séances varie selon la zone, le phototype, la couleur et le diamètre du poil, le cycle pilaire, les facteurs hormonaux et la réponse individuelle. Un résultat définitif à 100 % ne peut pas être garanti.</p>
<p>Les sensations peuvent être de chaleur, picotements ou claquements. Une rougeur, un œdème périfolliculaire, une sensation de chaleur ou une irritation transitoire peuvent survenir. Plus rarement, des troubles pigmentaires ou des brûlures peuvent apparaître.</p>
<p>Les consignes avant et après séance doivent être respectées. Toute prise de médicament, exposition solaire, modification de l’état de la peau ou grossesse doit être signalée.</p></div>
<h3>Déclarations</h3>${CK(d,'consent',DECL)}<div class="g">${SG(d,'sig','Signature client(e) / patient(e)')}${T(d,'consent_date','Date','date')}</div>`;

const pExpo=all=>`<h2>Exposition &amp; Préparation</h2><p class="mu">À vérifier avant chaque séance</p>`+(all?S.map(x=>sn(x)+eBody(x)).join(''):selBar()+(cs()?eBody(cs()):''));
const pCons=all=>`<h2>Consignes après Séance</h2><p class="mu">À remettre / rappeler au client</p><h3>Après la Séance</h3><ul><li>Éviter les sources de chaleur importantes et les soins irritants selon les recommandations de la praticienne.</li><li>Éviter l’exposition solaire et protéger la zone avec une protection solaire adaptée.</li><li>Ne pas arracher les poils entre les séances ; le rasage peut être utilisé si nécessaire.</li><li>Ne pas exfolier la zone tant qu’elle est irritée ou sensibilisée.</li><li>Contacter Le Spa en cas de réaction inhabituelle, importante ou persistante.</li></ul>`+(all?S.map(x=>sn(x)+cBody(x)).join(''):selBar()+(cs()?cBody(cs()):''));
const pSuivi=d=>`<h2>Suivi des Séances</h2><p class="mu">Une ligne par séance. Les zones, le phototype et la réaction se remplissent automatiquement ; complète la date, les paramètres et les initiales. Le bouton « Modifier » permet de corriger une ligne.</p><div class="tw"><table><tr><th>Séance<th>Date<th>Zone(s)<th>Phototype<th>Paramètres / réglages<th>Réaction<th>Initiales<th class="no"></tr>${S.map(x=>{const o=x.donnees,i=x.id,ke=(y,v)=>ed.has(String(i))?`<td><input type="text" data-k="${y}" data-s="${i}" value="${esc(v)}">`:`<td>${esc(v)}`,c=(k,t='text')=>`<td><input type="${t}" data-k="${k}" data-s="${i}" value="${esc(o[k])}">`;return `<tr><td>${x.numero}${c('date','date')}${ke('zo',zs(o))}${ke('po',phot(d,o))}${c('params')}${ke('ro',rx(o))}${c('initiales')}<td class="no"><button data-act="edR" data-id="${i}">${ed.has(String(i))?'Terminer':'Modifier'}</button>${ed.has(String(i))?` <button data-act="rsR" data-id="${i}">Rétablir</button>`:''} <button class="d" data-act="delS" data-id="${i}">Supprimer</button></tr>`}).join('')||'<tr><td colspan="8" class="mu">Aucune séance pour le moment.</tr>'}</table></div><p class="no"><button class="p2" data-act="addS">Ajouter une séance</button></p><h3>Notes / Incidents / Reports</h3>${A(d,'notes','')}`;
const pValid=()=>`<h2>Validation des Séances</h2><p class="mu">Signature et traçabilité</p><h3>Validation</h3><p>Pour chaque séance, le client ou la cliente confirme avoir signalé toute modification pertinente depuis le précédent rendez-vous. Les consignes adaptées lui ont été rappelées.</p><p class="mu">La date, la décision et le nom de la praticienne se remplissent automatiquement à partir des autres onglets. Il ne reste que les signatures.</p>${S.map(x=>{const o=x.donnees,i=x.id;return `<div class="vb"><b>Séance ${x.numero}</b><div class="g"><div class="f">Date<b>${fd(o.date)||'—'}</b></div><div class="f">Décision<b>${o.decision==DEC[1]?'Séance validée':o.decision==DEC[0]?'Séance à reporter':'En attente de validation'}</b></div><div class="f">Praticienne<b>${esc(o.prat)||'—'}</b></div></div><div class="g">${SG(o,'sigc','Signature client(e)',i)}${SG(o,'sigp','Signature praticienne',i)}</div></div>`}).join('')||'<p class="mu">Aucune séance pour le moment. Ajoute-la depuis l’onglet Suivi des séances.</p>'}`;
function render(){const m=$('#main');$('#hm').hidden=!C;if(!C){$('#tb').innerHTML='';m.innerHTML=home();return}
const d=C.dossier,TB=[['bilan','Bilan Initial',pBilan(d)],['sante','Questionnaire Santé',pSante(d)],['expo','Exposition & Préparation',pExpo()],['consent','Consentement',pConsent(d)],['cons','Consignes après Séance',pCons()],['suivi','Suivi des Séances',pSuivi(d)],['valid','Validation des Séances',pValid()]];
m.innerHTML=`${ph(d)}<div class="top"><h1>${esc(d.prenom)} ${esc(d.nom)}</h1><span class="no"><button data-act="print">Imprimer / PDF</button> <button class="d" data-act="delC">Supprimer</button></span></div>${TB.map(t=>`<section class="p" data-t="${t[0]}">${t[2]}</section>`).join('')}`;$('#tb').innerHTML=TB.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join('');showTab(tab)}
function showTab(t){tab=t;if(C&&(t=='suivi'||t=='valid'))document.querySelector(`[data-t="${t}"]`).innerHTML=t=='valid'?pValid():pSuivi(C.dossier);document.querySelectorAll('.p').forEach(p=>p.classList.toggle('on',p.dataset.t==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==t))}
const obj=s=>s?S.find(x=>x.id==s).donnees:C.dossier;
document.addEventListener('input',e=>{const t=e.target;if(!C||!(t.dataset.k||t.dataset.g))return;const o=obj(t.dataset.s);
if(t.dataset.g){const a=o[t.dataset.g]=o[t.dataset.g]||[],i=a.indexOf(t.dataset.v);if(t.checked&&i<0)a.push(t.dataset.v);if(!t.checked&&i>=0)a.splice(i,1);if(t.dataset.g=='sante')$('#al').textContent=alerte(o)}
else o[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;mark(t.dataset.s)});
document.addEventListener('toggle',e=>{const s=e.target.dataset&&e.target.dataset.sid;if(s)e.target.open?open.add(s):open.delete(s)},true);
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-sg],tr[data-go]');if(!t)return;const D=t.dataset;
if(D.id&&t.classList.contains('ci'))return openC(D.id);
if(D.sel){curS=D.sel;render();return}
if(D.tab){showTab(D.tab);scrollTo(0,0);return}
if(D.go){open.add(D.go);render();showTab('seances');return}
if(D.sg){const o=obj(D.s);cur={o,k:D.sg,s:D.s};drew=false;$('#cv').getContext('2d').clearRect(0,0,600,220);$('#dg').showModal();return}
if(t.id=='bg')return $('#side').classList.toggle('open');
if(t.id=='nw'||D.act=='newC'){$('#nn').value=$('#np').value='';$('#dn').showModal();$('#nn').focus();return}
if(D.act=='edR'){ed.has(D.id)?ed.delete(D.id):ed.add(D.id);refS();return}
if(D.act=='rsR'){const o=obj(D.id);delete o.zo;delete o.po;delete o.ro;mark(D.id);refS();return}
if(D.act=='home'){$('#side').classList.remove('open');await flush();C=null;S=[];drawList();render();scrollTo(0,0);return}
if(D.act=='print')return print();
if(D.act=='addS'){const r=await q(db.from('laser_seances').insert({client_id:C.id,numero:S.length+1,donnees:{date:today(),zl:[...(C.dossier.zones_l||[])],prat:S.length?S[S.length-1].donnees.prat||'':''}}).select().single());S.push(r);curS=r.id;render()}
if(D.act=='delS'&&confirm('Supprimer cette séance définitivement ?')){await q(db.from('laser_seances').delete().eq('id',D.id));S=S.filter(s=>s.id!=D.id);S.forEach((s,i)=>{if(s.numero!=i+1){s.numero=i+1;db.from('laser_seances').update({numero:i+1}).eq('id',s.id).then(()=>{})}});curS=null;render()}
if(D.act=='delC'&&confirm('Supprimer ce dossier et toutes ses séances définitivement ?')){await q(db.from('laser_clients').delete().eq('id',C.id));list=list.filter(x=>x.id!=C.id);C=null;S=[];dirty.clear();drawList();render()}});
$('#q').oninput=drawList;
const cv=$('#cv'),cx=cv.getContext('2d'),pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cx.lineWidth=2.5;cx.lineCap='round';cx.strokeStyle='#2b1a1f';let dr=false;
cv.onpointerdown=e=>{dr=drew=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...pt(e))};
cv.onpointermove=e=>{if(dr){cx.lineTo(...pt(e));cx.stroke()}};cv.onpointerup=()=>dr=false;
$('#sx').onclick=()=>{cx.clearRect(0,0,600,220);drew=false};$('#sc').onclick=()=>$('#dg').close();
$('#sv').onclick=()=>{cur.o[cur.k]=drew?cv.toDataURL('image/png'):'';$('#dg').close();const el=document.querySelector(`[data-sg="${cur.k}"]${cur.s?`[data-s="${cur.s}"]`:':not([data-s])'}`);el.innerHTML=cur.o[cur.k]?`<img src="${cur.o[cur.k]}" alt="Signature">`:'Toucher pour signer';mark(cur.s)};
onbeforeprint=()=>{if(!C)return;document.querySelector('[data-t="expo"]').innerHTML=pExpo(1);document.querySelector('[data-t="cons"]').innerHTML=pCons(1);document.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})};
onafterprint=()=>{if(C)render()};
onbeforeunload=e=>{if(dirty.size)e.preventDefault()};
async function mk(){const nom=$('#nn').value.trim(),prenom=$('#np').value.trim();if(!nom){$('#nn').focus();return}await flush();$('#dn').close();const r=await q(db.from('laser_clients').insert({nom,prenom,dossier:{nom,prenom,date_bilan:today()}}).select().single());list.push(r);await openC(r.id)}
$('#nk').onclick=mk;$('#nx').onclick=()=>$('#dn').close();$('#nn').onkeydown=$('#np').onkeydown=e=>{if(e.key=='Enter')mk()};
async function enter(){$('#lg').style.display='none';$('#out').hidden=false;await loadList();render()}
async function login(){const{error}=await db.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error){$('#lerr').textContent='Adresse e-mail ou mot de passe incorrect.';return}$('#lp').value='';enter()}
$('#li').onclick=login;$('#lp').onkeydown=e=>{if(e.key=='Enter')login()};
$('#out').onclick=async()=>{await flush();await db.auth.signOut();location.reload()};
(async()=>{const{data}=await db.auth.getSession();if(data.session)enter();else $('#lg').style.display='flex'})();
</script></body></html>
